[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubt-race-docs"
dynamic = ["version"]
description = "Генератор печатных документов гонки UBT TT (номера, грамоты, расписки, призовые)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "reportlab>=4.1",
    "openpyxl>=3.1",
]

[project.scripts]
ubt-race-docs = "ubt_race_docs.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pypdf>=4.2",
    "pytest>=8.2",
    "ruff>=0.6",
]

# Версия проекта живёт в одном месте — в `__init__.py`. Если держать её здесь,
# релизный PR правит pyproject, а `uv.lock` остаётся со старой версией, и
# `uv sync --locked` в CI падает. При dynamic-версии uv не пишет её в лок,
# а release-please сам пропускает pyproject и правит `__init__.py`.
[tool.setuptools.dynamic]
version = { attr = "ubt_race_docs.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ubt_race_docs = [
    "assets/backgrounds/*.jpeg",
    "assets/backgrounds/*.jpg",
    "assets/backgrounds/*.png",
    "assets/fonts/*.ttf",
    "assets/fonts/*.txt",
    "assets/images/*.png",
    "assets/models/*.scad",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
# Документы и подписи в них — на русском и казахском, кириллица в строках и
# докстрингах это норма, а не «похожий на латиницу» символ.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["reportlab.*", "openpyxl.*"]
ignore_missing_imports = true
