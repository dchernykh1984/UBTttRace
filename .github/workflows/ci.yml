name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install project
        run: uv sync --locked

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # Тот же набор проверок, что и на локальном коммите: ruff, mypy
      # и гигиена файлов.
      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --locked

      - name: pytest
        run: uv run pytest

  build:
    name: Build print kit
    needs: [quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install project
        run: uv sync --locked

      # Сборка 2021 года из apt не знает движка manifold и режет гравировку
      # логотипа минутами; свежий AppImage делает то же за секунды.
      - name: Install openscad
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core libgl1
          curl -sSLo "$RUNNER_TEMP/openscad.AppImage" \
            https://files.openscad.org/snapshots/OpenSCAD-2026.06.12-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/openscad.AppImage"
          echo "OPENSCAD=$RUNNER_TEMP/openscad.AppImage" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Check the trophy model compiles
        # Тесты кубков при установленном openscad прогоняют модель целиком
        # и проверяют, что гравировка доезжает до неё параметрами.
        run: uv run pytest tests/test_trophies.py

      - name: Build everything for print
        run: uv run ubt-race-docs all --with-trophies --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: print-kit
          path: dist/
          retention-days: 14
