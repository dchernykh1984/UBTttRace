name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check --diff .

      - name: mypy
        run: mypy

  tests:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest

  build:
    name: Build print kit
    needs: [quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Install openscad
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad fonts-dejavu-core

      - name: Check the trophy model compiles
        # Тесты кубков при установленном openscad прогоняют модель целиком
        # и проверяют, что гравировка доезжает до неё параметрами.
        run: pytest tests/test_trophies.py

      - name: Build everything for print
        run: ubt-race-docs all --with-trophies --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: print-kit
          path: dist/
          retention-days: 14
