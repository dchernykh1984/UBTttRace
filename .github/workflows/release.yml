name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / GitHub release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  print-kit:
    name: Attach print kit to the release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install project
        run: uv sync --locked --no-dev

      # Сборка 2021 года из apt не знает движка manifold и режет гравировку
      # логотипа минутами; свежий AppImage делает то же за секунды.
      - name: Install openscad
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core libgl1
          curl -sSLo "$RUNNER_TEMP/openscad.AppImage" \
            https://files.openscad.org/snapshots/OpenSCAD-2026.06.12-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/openscad.AppImage"
          echo "OPENSCAD=$RUNNER_TEMP/openscad.AppImage" >> "$GITHUB_ENV"
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Build everything for print
        run: uv run ubt-race-docs all --with-trophies --out dist

      - name: Pack the whole kit
        run: zip -j -r "ubt-tt-print-kit-${TAG}.zip" dist
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Attach to the release
        run: gh release upload "$TAG" dist/* "ubt-tt-print-kit-${TAG}.zip" --clobber
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
