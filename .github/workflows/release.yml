name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / GitHub release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  print-kit:
    name: Attach print kit to the release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: pip install .

      - name: Install openscad
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad fonts-dejavu-core

      - name: Build everything for print
        run: ubt-race-docs all --with-trophies --out dist

      - name: Pack the whole kit
        run: zip -j -r "ubt-tt-print-kit-${TAG}.zip" dist
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Attach to the release
        run: gh release upload "$TAG" dist/* "ubt-tt-print-kit-${TAG}.zip" --clobber
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
